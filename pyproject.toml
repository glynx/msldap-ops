[project]
name = "msldap-ops"
version = "0.1.0"
description = "Operator toolkit on top of msldap: query logging for bofhound, query presets and an extended shell"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "msldap @ git+https://github.com/glynx/msldap.git@main",
    "rich>=13",
]

[project.scripts]
msldap-ops = "msldap_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# needed for the git dependency on the msldap fork
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/msldap_ops"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
